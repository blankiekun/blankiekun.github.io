<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CONscripter</title>
<style>
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
canvas, video, #overlay { position: absolute; inset: 0; margin: auto; display: block; outline: none; }
video[hidden] { display: none; }
/* The page's text, invisible, over the characters the engine drew: Yomitan reads it on
   hover, and selecting it shows where it is. Same idea as chimimouryou's player. */
#overlay { pointer-events: none; overflow: hidden; }
#page-text, #sprite-text, #choices { position: absolute; inset: 0; }
#page-text[hidden], #sprite-text[hidden] { display: none; }
#overlay div div { position: absolute; white-space: pre; line-height: 1; color: transparent; pointer-events: auto; cursor: default; }
#overlay div div::selection { background: rgba(255, 220, 120, .35); }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="overlay" lang="ja"><div id="page-text"></div><div id="sprite-text"></div><div id="choices"></div></div>
<video id="video" hidden playsinline></video>
<script src="conscripter.js"></script>
<script>
// The host page for CONscripter (conscripter.js/.wasm are the v0.20.0 web release).
// The Program window in js/apps/conscripter.js makes one of these per game and calls
// start() with the visitor's own files. Nothing is uploaded: game files are read
// straight off their disk as the engine asks for them, so one big .nsa never has to
// fit in memory, and saves live in this browser's IndexedDB.

const canvas = document.getElementById('canvas');
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const pageText = document.getElementById('page-text');
const spriteText = document.getElementById('sprite-text');
const choices = document.getElementById('choices');
const GAMEDIR = '/onsyuri/game';
let savedir = null;

// ---- what the engine expects to find on the page ----

var g_onsyuri_module = { canvas, print: s => console.log(s), printErr: s => console.warn(s) };
var g_onsyuri_index = {};
var g_onsyuri_filemap = {};      // empty: no server lazyload, every file is already mounted
function fetch_file() { return Promise.resolve(0); }

var g_screen_width = 640, g_screen_height = 480;
function scale_full(el, ratio) {
  const w = innerWidth, h = innerHeight;
  const fw = w / h > ratio ? h * ratio : w;
  el.style.width = overlay.style.width = Math.floor(fw) + 'px';
  el.style.height = overlay.style.height = Math.floor(fw / ratio) + 'px';
  // Overlay lines are laid out in game pixels, scaled like the canvas.
  overlay.style.setProperty('--scale', Math.floor(fw) / g_screen_width);
}
addEventListener('resize', () => scale_full(canvas, g_screen_width / g_screen_height));

let flushing = null;
function flush_save() {
  if (!savedir) return Promise.resolve();
  const run = () => new Promise(res => g_onsyuri_module.FS.syncfs(false, err => { if (err) console.warn(err); res(); }));
  flushing = (flushing || Promise.resolve()).then(run);
  return flushing;
}

// A skipped movie must stop: hiding it and clearing src leaves its sound
// playing in some browsers.
let videoSkippable = false;
function videoEnded() {
  videoSkippable = false;
  video.onclick = null;
  video.pause();
  canvas.style.display = overlay.style.display = '';
  video.hidden = true;
  if (video.src.startsWith('blob:')) URL.revokeObjectURL(video.src);
  video.removeAttribute('src');
  video.load();
  g_onsyuri_module.wait_video = false;
}
// Enter, Space and Escape skip it, as in the native player.
window.addEventListener('keyup', e => {
  if (videoSkippable && (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape')) videoEnded();
});
function playVideo(path, click, loop) {
  g_onsyuri_module.wait_video = true;
  const data = g_onsyuri_module.FS.readFile(path);
  video.src = URL.createObjectURL(new Blob([data], { type: 'video/mp4' }));
  video.style.width = canvas.style.width;
  video.style.height = canvas.style.height;
  canvas.style.display = overlay.style.display = 'none';
  video.hidden = false;
  video.onclick = click ? videoEnded : null;
  videoSkippable = !!click;
  video.loop = loop;
  video.muted = false;
  video.play().catch(() => { video.muted = true; video.play().catch(videoEnded); });
}
video.addEventListener('ended', videoEnded);
video.addEventListener('error', videoEnded);

// ---- text for Yomitan ----

// The engine hands over the page's script bytes and where it drew each character
// (byte offset, x, y, font size: four numbers each), at every click wait.
let encoding = 'sjis';

function decodeText(bytes) {
  // Indents are written as a Shift JIS space even in UTF-8 games.
  return new TextDecoder(encoding === 'utf8' ? 'utf-8' : 'shift_jis').decode(bytes).replace(/�@?/g, '　');
}

function charLength(lead) {
  if (encoding === 'utf8') return lead < 0x80 ? 1 : lead >= 0xf0 ? 4 : lead >= 0xe0 ? 3 : 2;
  return (lead >= 0x81 && lead <= 0x9f) || (lead >= 0xe0 && lead <= 0xfc) ? 2 : 1;
}

// Characters grouped into screen lines. Ruby readings have no boxes, so lines hold the base text.
// One pitch per line, from its first and last character.
function overlayLines(bytes, boxes) {
  const lines = [];
  for (let i = 0; i + 3 < boxes.length; i += 4) {
    const off = boxes[i];
    if (off >= bytes.length) break;
    const ch = decodeText(bytes.subarray(off, off + charLength(bytes[off])));
    const x = boxes[i + 1], y = boxes[i + 2], size = boxes[i + 3];
    const line = lines[lines.length - 1];
    if (line && line.y === y && x > line.last) { line.text += ch; line.last = x; line.count++; }
    else lines.push({ text: ch, x, y, size, last: x, count: 1 });
  }
  return lines.map(l => ({ text: l.text, x: l.x, y: l.y, size: l.size, pitch: l.count > 1 ? (l.last - l.x) / (l.count - 1) : l.size }));
}

function lineDiv(line) {
  const div = document.createElement('div');
  div.textContent = line.text;
  div.style.left = (100 * line.x) / g_screen_width + '%';
  div.style.top = (100 * line.y) / g_screen_height + '%';
  div.style.fontSize = `calc(var(--scale) * ${line.size}px)`;
  div.style.letterSpacing = `calc(var(--scale) * ${line.pitch - line.size}px)`;
  return div;
}

function onsyuriText(bytes, skipped, boxes) { pageText.replaceChildren(...overlayLines(bytes, boxes).map(lineDiv)); }

// A choice or system menu item drawn by the engine.
function onsyuriChoice(bytes, x, y, size, pitch) { choices.append(lineDiv({ text: decodeText(bytes), x, y, size, pitch })); }

let stashedChoices = [], stashedPage = [], inSystem = false, inBacklog = false, windowHidden = false;
function updateHidden() {
  pageText.hidden = windowHidden || (inSystem && !inBacklog);
  spriteText.hidden = inSystem;
}

// The engine says when text leaves the screen: 'page' (new page), 'hide'/'show' (text window
// hidden and back), 'choices' (buttons removed), 'enter'/'leave' (system menu or backlog over
// the page and back), 'reset' (left the system menu elsewhere, e.g. a loaded game).
function onsyuriOverlay(event) {
  if (event === 'page') pageText.textContent = '';
  else if (event === 'choices') choices.textContent = '';
  else if (event === 'hide') windowHidden = true;
  else if (event === 'show') windowHidden = false;
  else if (event === 'enter') {
    stashedChoices = [...choices.children];
    stashedPage = [...pageText.children];
    choices.textContent = '';
    inSystem = true; inBacklog = false;
  } else if (event === 'leave') {
    choices.replaceChildren(...stashedChoices);
    pageText.replaceChildren(...stashedPage);
    inSystem = false;
  } else if (event === 'reset') {
    pageText.textContent = choices.textContent = '';
    inSystem = windowHidden = false;
  }
  updateHidden();
}

// A page of the built-in backlog (between 'enter' and 'leave').
function onsyuriBacklog(bytes, boxes) {
  pageText.replaceChildren(...overlayLines(bytes, boxes).map(lineDiv));
  inBacklog = true;
  updateHidden();
}

// The visible string sprites (strsp: script-drawn menus and backlogs) at each wait for input.
function onsyuriSprites(bytes, boxes) { spriteText.replaceChildren(...overlayLines(bytes, boxes).map(lineDiv)); }

// Clicks on the text go to the game, as if it weren't there. Hover stays with the page,
// since Yomitan scans on mousemove.
for (const type of ['mousedown', 'mouseup', 'mousemove', 'click', 'contextmenu', 'wheel', 'touchstart', 'touchmove', 'touchend']) {
  overlay.addEventListener(type, e => {
    if (type !== 'mousemove') e.preventDefault();
    try { canvas.dispatchEvent(new e.constructor(type, e)); } catch (err) { console.warn('Could not pass ' + type + ' to the game', err); }
  });
}

// ---- game files, read on demand ----

// Emscripten's own lazy files need a web worker, so these nodes read 1 MB slices of
// the File with a synchronous XHR on a blob: URL instead, and keep the most recent
// chunks around. The engine's fread() never notices.
const CHUNK = 1 << 20, CACHE_CHUNKS = 64;
const cache = new Map();
let nextId = 0;

function readSlice(file, start, end) {
  const url = URL.createObjectURL(file.slice(start, end));
  try {
    const x = new XMLHttpRequest();
    x.open('GET', url, false);
    x.overrideMimeType('text/plain; charset=x-user-defined');
    x.send();
    const s = x.responseText, out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i) & 0xff;
    return out;
  } finally {
    URL.revokeObjectURL(url);
  }
}

function chunk(file, id, n) {
  const key = id + ':' + n;
  let c = cache.get(key);
  if (c) { cache.delete(key); cache.set(key, c); return c; }
  c = readSlice(file, n * CHUNK, Math.min(file.size, (n + 1) * CHUNK));
  cache.set(key, c);
  if (cache.size > CACHE_CHUNKS) cache.delete(cache.keys().next().value);
  return c;
}

function mountFile(FS, path, file) {
  const i = path.lastIndexOf('/');
  const node = FS.createFile(path.slice(0, i), path.slice(i + 1), {}, true, false);
  const id = nextId++;
  Object.defineProperty(node, 'usedBytes', { get: () => file.size });
  node.stream_ops = {
    ...node.stream_ops,
    read(stream, buffer, offset, length, position) {
      const end = Math.min(file.size, position + length);
      for (let p = position; p < end;) {
        const n = Math.floor(p / CHUNK), c = chunk(file, id, n), s = p - n * CHUNK;
        const take = Math.min(end - p, c.length - s);
        buffer.set(c.subarray(s, s + take), offset + (p - position));
        p += take;
      }
      return Math.max(0, end - position);
    },
  };
}

function mkdirs(FS, path) {
  let cur = '';
  for (const part of path.split('/').filter(Boolean)) {
    cur += '/' + part;
    try { FS.mkdir(cur); } catch {}
  }
}

// ---- saves ----

function listSaves() {
  const FS = g_onsyuri_module.FS, out = [];
  (function walk(dir, rel) {
    for (const name of FS.readdir(dir)) {
      if (name === '.' || name === '..') continue;
      const p = dir + '/' + name, st = FS.stat(p);
      if (FS.isDir(st.mode)) walk(p, rel + name + '/');
      else if (FS.isFile(st.mode)) out.push({ path: rel + name, data: FS.readFile(p), mtime: st.mtime });
    }
  })(savedir, '');
  return out;
}

async function writeSaves(files) {
  const FS = g_onsyuri_module.FS;
  for (const f of files) {
    const p = savedir + '/' + f.path;
    mkdirs(FS, p.slice(0, p.lastIndexOf('/')));
    FS.writeFile(p, f.data);
  }
  await flush_save();
}

// ---- the parent window drives these ----

function key(type, keyCode, code) {
  canvas.dispatchEvent(new KeyboardEvent(type, { bubbles: true, cancelable: true, keyCode, which: keyCode, key: code === 'Escape' ? 'Escape' : 'Control', code }));
}
function pressEsc() { key('keydown', 27, 'Escape'); setTimeout(() => key('keyup', 27, 'Escape'), 50); }
function setSkip(on) { key(on ? 'keydown' : 'keyup', 17, 'ControlLeft'); }

// Drops on the running game go to the window around it.
addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
addEventListener('drop', e => { e.preventDefault(); if (window.onGameDrop) window.onGameDrop(e.dataTransfer); });
addEventListener('pointerdown', () => canvas.focus());

// game: { files: [{ path, file }], title, font, encoding ('sjis' | 'utf8'), onExit(code), onError(msg) }
async function start(game) {
  const M = g_onsyuri_module;
  M.onExit = code => game.onExit && game.onExit(code);
  M.onAbort = what => game.onError && game.onError(String(what));
  g_onsyuri_index = { title: game.title };
  encoding = game.encoding === 'utf8' ? 'utf8' : 'sjis';
  await onsyuri(M);
  const FS = M.FS;
  for (const f of game.files) {
    const p = GAMEDIR + '/' + f.path;
    mkdirs(FS, p.slice(0, p.lastIndexOf('/')));
    mountFile(FS, p, f.file);
  }
  savedir = '/onsyuri_save/' + game.title;
  mkdirs(FS, savedir);
  FS.mount(M.IDBFS, {}, savedir);
  await new Promise(res => FS.syncfs(true, err => { if (err) console.warn(err); res(); }));
  canvas.focus();
  M.callMain(['--root', GAMEDIR, '--font', GAMEDIR + '/' + game.font, '--save-dir', savedir, '--enc:' + encoding]);
}
</script>
</body>
</html>
