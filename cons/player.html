<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CONscripter</title>
<style>
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
canvas, video, #overlay { position: absolute; inset: 0; margin: auto; display: block; outline: none; }
video[hidden], #hold[hidden] { display: none; }
#hold { touch-action: none; }
/* The page's text, invisible, over the characters the engine drew: Yomitan reads it on
   hover, and selecting it shows where it is. Same idea as chimimouryou's player. */
#overlay { pointer-events: none; overflow: hidden; }
#page-text, #sprite-text, #choices { position: absolute; inset: 0; }
#page-text[hidden], #sprite-text[hidden] { display: none; }
#overlay div div { position: absolute; white-space: pre; line-height: 1; color: transparent; pointer-events: auto; cursor: default; }
#overlay div div::selection { background: rgba(255, 220, 120, .35); }
/* Debug > Show Text Overlay */
body.show-text #overlay div div { color: rgba(255, 64, 64, .9); background: rgba(255, 255, 0, .18); outline: 1px solid rgba(255, 255, 0, .5); }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="overlay" lang="ja"><div id="page-text"></div><div id="sprite-text"></div><div id="choices"></div></div>
<video id="video" hidden playsinline></video>
<canvas id="hold" hidden oncontextmenu="event.preventDefault()"></canvas>
<script>
// The engine release comes in as ?version from ENGINE_VERSION in js/apps/conscripter.js (Help > About shows it),
// so it is written in one place only. Written, not appended, so it still runs before the scripts below.
document.write('<script src="conscripter.js' + location.search + '"><\/script>');
</script>
<script>
// The host page for CONscripter (conscripter.js/.wasm are the web release that ENGINE_VERSION names).
// The Program window in js/apps/conscripter.js makes one of these per game and calls
// start() with the visitor's own files. Nothing is uploaded: game files are read
// straight off their disk as the engine asks for them, so one big .nsa never has to
// fit in memory, and saves live in this browser's IndexedDB (and, with sync on, the
// window around this copies them to the visitor's Google Drive).

const canvas = document.getElementById('canvas');
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const holdCanvas = document.getElementById('hold'); // mpeghold's sprite, over the movie
const pageText = document.getElementById('page-text');
const spriteText = document.getElementById('sprite-text');
const choices = document.getElementById('choices');
const GAMEDIR = '/cons/game';
let savedir = null;

// ---- what the engine expects to find on the page ----

// What the engine prints, for Debug > Engine Log.
var engineLog = []; // var: the parent reads it
function logLine(s) { engineLog.push(s); if (engineLog.length > 5000) engineLog.splice(0, 1000); }
// ?version on the engine's files: a cached old conscripter.js with a new .wasm can't start.
var g_cons_module = { canvas, locateFile: (p, dir) => dir + p + location.search, print: s => { logLine(s); console.log(s); }, printErr: s => { logLine(s); console.warn(s); } };
// The engine's debug trace (CONscripter's DEBUG.md), for Debug > Dump Game State and Save Trace.
var traceLines = []; // var: the parent reads it
let traceWaiter = null;
function consTrace(line) {
  traceLines.push(line);
  if (traceLines.length > 20000) traceLines.splice(1, 5000); // keep [0], the meta record
  if (traceWaiter && line.startsWith('{"t":"dump"')) traceWaiter(line);
}
var g_cons_index = {};
var g_cons_filemap = {};      // empty: no server lazyload, every file is already mounted
function fetch_file() { return Promise.resolve(0); }

var g_screen_width = 640, g_screen_height = 480;
function scale_full(el, ratio) {
  const w = innerWidth, h = innerHeight;
  const fw = w / h > ratio ? h * ratio : w;
  el.style.width = overlay.style.width = Math.floor(fw) + 'px';
  el.style.height = overlay.style.height = Math.floor(fw / ratio) + 'px';
  // Overlay lines are laid out in game pixels, scaled like the canvas.
  overlay.style.setProperty('--scale', Math.floor(fw) / g_screen_width);
}
addEventListener('resize', () => scale_full(canvas, g_screen_width / g_screen_height));

let flushing = null;
function flush_save() {
  if (!savedir) return Promise.resolve();
  const run = () => new Promise(res => g_cons_module.FS.syncfs(false, err => { if (err) console.warn(err); res(); }));
  // The engine calls this after every save; the window around it copies them to Google Drive.
  flushing = (flushing || Promise.resolve()).then(run).then(() => { if (window.onSaved) window.onSaved(); });
  return flushing;
}

// A movie from the game's files, as a Blob. A game file plays from its File, unread:
// FS.readFile would read it all synchronously (a sync XHR, and Firefox's sound gap, per MB).
function movieBlob(path) {
  const lazy = g_cons_module.FS.lookupPath(path).node.lazy;
  return new Blob([lazy ? lazy.file : g_cons_module.FS.readFile(path)], { type: 'video/mp4' });
}

// A skipped movie must stop: hiding it and clearing src leaves its sound
// playing in some browsers.
let videoSkippable = false;
function videoSkipped() { g_cons_module.video_skipped = true; videoEnded(); }
function videoEnded() {
  holdEnded();
  videoSkippable = false;
  video.onclick = null;
  video.pause();
  canvas.style.display = overlay.style.display = '';
  video.hidden = true;
  if (video.src.startsWith('blob:')) URL.revokeObjectURL(video.src);
  video.removeAttribute('src');
  video.load();
  g_cons_module.wait_video = false;
}
// Enter, Space and Escape skip it, as in the native player.
window.addEventListener('keyup', e => {
  if (videoSkippable && (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape')) videoSkipped();
});
function showVideo(path) {
  video.src = URL.createObjectURL(movieBlob(path));
  video.style.width = canvas.style.width;
  video.style.height = canvas.style.height;
  canvas.style.display = overlay.style.display = 'none';
  video.hidden = false;
}
function playVideo(path, click, loop) {
  g_cons_module.wait_video = true;
  g_cons_module.video_skipped = false;
  showVideo(path);
  video.onclick = click ? videoSkipped : null;
  videoSkippable = !!click;
  video.loop = loop;
  video.muted = false;
  video.play().catch(() => { video.muted = true; video.play().catch(videoEnded); });
}
video.addEventListener('ended', videoEnded);
video.addEventListener('error', videoEnded);

// mpeghold: the movie plays while the pointer, Enter or Space is held down on it, under
// the engine's sprite (a "hold the button" prompt); g_cons_module.video_held tells the engine.
let hold = null;
function holdSet() {
  if (!hold) return;
  const down = hold.pointers.size > 0 || hold.keys.size > 0;
  if (down === !!g_cons_module.video_held) return;
  g_cons_module.video_held = down;
  if (down) video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });
  else video.pause();
}
function holdKey(e) {
  if (!hold || !(e.key === 'Enter' || e.key === ' ')) return;
  e.preventDefault();
  if (e.type === 'keydown') hold.keys.add(e.key); else hold.keys.delete(e.key);
  holdSet();
}
addEventListener('keydown', holdKey);
addEventListener('keyup', holdKey);
holdCanvas.addEventListener('pointerdown', e => {
  if (!hold || e.button > 0) return;
  holdCanvas.setPointerCapture(e.pointerId);
  hold.pointers.add(e.pointerId);
  holdSet();
});
for (const type of ['pointerup', 'pointercancel', 'lostpointercapture'])
  holdCanvas.addEventListener(type, e => { if (hold) { hold.pointers.delete(e.pointerId); holdSet(); } });
addEventListener('blur', () => { if (hold) { hold.pointers.clear(); hold.keys.clear(); holdSet(); } });

// rgba: the sprite's picture (w x h, stride px a row), cells side by side, each shown ms;
// drawn at x,y of the sw x sh screen.
function playVideoHold(path, rgba, w, h, stride, cells, ms, x, y, sw, sh) {
  g_cons_module.wait_video = true;
  g_cons_module.video_held = false;
  g_cons_module.video_hold_end = 0;
  showVideo(path);
  video.loop = false;
  video.muted = false;
  video.onclick = null;
  videoSkippable = false;
  video.preload = 'auto';
  video.pause();
  holdCanvas.style.width = video.style.width;
  holdCanvas.style.height = video.style.height;
  holdCanvas.width = sw;
  holdCanvas.height = sh;
  holdCanvas.hidden = false;
  const ctx = holdCanvas.getContext('2d');
  ctx.clearRect(0, 0, sw, sh);
  hold = { pointers: new Set(), keys: new Set(), timer: null };
  if (rgba && w > 0 && h > 0) {
    const image = new ImageData(w, h);
    for (let row = 0; row < h; row++) image.data.set(rgba.subarray(row * stride * 4, row * stride * 4 + w * 4), row * w * 4);
    const n = Math.max(cells, 1), cw = Math.floor(w / n);
    let cell = 0;
    const draw = () => {
      ctx.clearRect(0, 0, sw, sh);
      ctx.putImageData(image, x - cell * cw, y, cell * cw, 0, cw, h);
      cell = (cell + 1) % n;
    };
    draw();
    if (n > 1 && ms > 0) hold.timer = setInterval(draw, ms);
  }
}
function holdEnded() {
  if (!hold) return;
  g_cons_module.video_hold_end = (hold.pointers.size > 0 ? 1 : 0) | (hold.keys.has('Enter') ? 2 : 0) | (hold.keys.has(' ') ? 8 : 0);
  if (hold.timer) clearInterval(hold.timer);
  hold = null;
  g_cons_module.video_held = false;
  holdCanvas.hidden = true;
}

// Movies whose frames the engine draws (a movie as a picture; mpegplay under the text
// window): a hidden <video> each, its current frame read through a canvas as RGBA bytes.
var g_cons_movies = {}; // var: the engine reads it
let movieId = 0;
function consMovieOpen(path, loop, sound, w, h) {
  let blob;
  try { blob = movieBlob(path); } catch { console.error('no movie ' + path); return -1; }
  const v = document.createElement('video'), id = ++movieId;
  const m = { video: v, state: 0, last: -1, w, h, ctx: null };
  v.muted = !sound; v.loop = !!loop; v.playsInline = true; v.preload = 'auto';
  // In the page (a detached or hidden video may not decode), unseen.
  v.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none';
  v.onloadeddata = () => { if (m.state === 0) m.state = 1; };
  v.onerror = () => { m.state = -1; };
  v.src = URL.createObjectURL(blob);
  document.body.appendChild(v);
  v.play().catch(() => { v.muted = true; v.play().catch(() => { m.state = -1; }); });
  g_cons_movies[id] = m;
  return id;
}
function consMovieState(id) { const m = g_cons_movies[id]; return m ? m.state : -1; }
// The frame as RGBA bytes when it changed since the last call, else null.
function consMovieFrame(id, w, h) {
  const m = g_cons_movies[id];
  if (!m || m.video.readyState < 2 || m.video.currentTime === m.last) return null;
  m.last = m.video.currentTime;
  if (!m.ctx) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    m.ctx = c.getContext('2d', { willReadFrequently: true });
  }
  m.ctx.drawImage(m.video, 0, 0, w, h);
  return m.ctx.getImageData(0, 0, w, h).data;
}
function consMovieEnded(id) { const m = g_cons_movies[id]; return !m || m.state < 0 || m.video.ended ? 1 : 0; }
function consMovieClose(id) {
  const m = g_cons_movies[id];
  if (!m) return;
  const v = m.video;
  v.pause();
  if (v.src.startsWith('blob:')) URL.revokeObjectURL(v.src);
  v.removeAttribute('src');
  v.load();
  v.remove();
  delete g_cons_movies[id];
}

// ---- text for Yomitan ----

// The engine hands over the page's script bytes and where it drew each character
// (byte offset, x, y, font size: four numbers each), at every click wait.
let encoding = 'sjis';

function decodeText(bytes) {
  // Indents are written as a Shift JIS space even in UTF-8 games.
  return new TextDecoder(encoding === 'utf8' ? 'utf-8' : 'shift_jis').decode(bytes).replace(/�@?/g, '　');
}

function charLength(lead) {
  if (encoding === 'utf8') return lead < 0x80 ? 1 : lead >= 0xf0 ? 4 : lead >= 0xe0 ? 3 : 2;
  return (lead >= 0x81 && lead <= 0x9f) || (lead >= 0xe0 && lead <= 0xfc) ? 2 : 1;
}

// Characters grouped into screen lines. Ruby readings have no boxes, so lines hold the base text.
// A line runs right (same y) or, in vertical games like Muramasa, down (same x); its second
// character decides which. One pitch per line, from its first and last character.
function overlayLines(bytes, boxes) {
  const lines = [];
  for (let i = 0; i + 3 < boxes.length; i += 4) {
    const off = boxes[i];
    if (off >= bytes.length) break;
    const ch = decodeText(bytes.subarray(off, off + charLength(bytes[off])));
    const x = boxes[i + 1], y = boxes[i + 2], size = boxes[i + 3];
    const line = lines[lines.length - 1];
    const right = line && !line.vertical && line.y === y && x > line.lastX;
    const down = line && (line.vertical || line.count === 1) && line.x === x && y > line.lastY;
    if (right || down) { line.text += ch; line.lastX = x; line.lastY = y; line.count++; line.vertical = down; }
    else lines.push({ text: ch, x, y, size, lastX: x, lastY: y, count: 1, vertical: false });
  }
  return lines.map(l => {
    const span = l.vertical ? l.lastY - l.y : l.lastX - l.x;
    return { text: l.text, x: l.x, y: l.y, size: l.size, vertical: l.vertical, pitch: l.count > 1 ? span / (l.count - 1) : l.size };
  });
}

function lineDiv(line) {
  const div = document.createElement('div');
  div.textContent = line.text;
  div.style.left = (100 * line.x) / g_screen_width + '%';
  div.style.top = (100 * line.y) / g_screen_height + '%';
  div.style.fontSize = `calc(var(--scale) * ${line.size}px)`;
  div.style.letterSpacing = `calc(var(--scale) * ${line.pitch - line.size}px)`;
  // Yomitan reads writing-mode to know the text is vertical and opens its popup beside it.
  if (line.vertical) div.style.writingMode = 'vertical-rl';
  return div;
}

function consText(bytes, skipped, boxes) {
  const lines = overlayLines(bytes, boxes);
  pageText.replaceChildren(...lines.map(lineDiv));
  if (!skipped) keepLine(lines); // skipped text goes by too fast to mine
}

// A choice or system menu item drawn by the engine.
function consChoice(bytes, x, y, size, pitch) { choices.append(lineDiv({ text: decodeText(bytes), x, y, size, pitch })); }

let stashedChoices = [], stashedPage = [], inSystem = false, inBacklog = false, windowHidden = false;
function updateHidden() {
  pageText.hidden = windowHidden || (inSystem && !inBacklog);
  spriteText.hidden = inSystem;
}

// The engine says when text leaves the screen: 'page' (new page), 'hide'/'show' (text window
// hidden and back), 'choices' (buttons removed), 'enter'/'leave' (system menu or backlog over
// the page and back), 'reset' (left the system menu elsewhere, e.g. a loaded game).
function consOverlay(event) {
  if (event === 'page') { pageText.textContent = ''; lineVoice = null; }
  else if (event === 'choices') choices.textContent = '';
  else if (event === 'hide') windowHidden = true;
  else if (event === 'show') windowHidden = false;
  else if (event === 'enter') {
    stashedChoices = [...choices.children];
    stashedPage = [...pageText.children];
    choices.textContent = '';
    inSystem = true; inBacklog = false;
  } else if (event === 'leave') {
    choices.replaceChildren(...stashedChoices);
    pageText.replaceChildren(...stashedPage);
    inSystem = false;
  } else if (event === 'reset') {
    pageText.textContent = choices.textContent = '';
    inSystem = windowHidden = false;
  }
  updateHidden();
}

// A page of the built-in backlog (between 'enter' and 'leave').
function consBacklog(bytes, boxes, voice) {
  const lines = overlayLines(bytes, boxes);
  backlogVoice = voice;
  backlogText = lines.map(l => l.text).join('');
  pageText.replaceChildren(...lines.map(lineDiv));
  inBacklog = true;
  updateHidden();
}

// The visible string sprites (strsp: script-drawn menus and backlogs) at each wait for input.
function consSprites(bytes, boxes) {
  const lines = overlayLines(bytes, boxes);
  spriteLines = lines.map(l => l.text).join('');
  spriteText.replaceChildren(...lines.map(lineDiv));
}

// Clicks on the text go to the game, as if it weren't there. Hover stays with the page,
// since Yomitan scans on mousemove.
for (const type of ['mousedown', 'mouseup', 'mousemove', 'click', 'contextmenu', 'wheel', 'touchstart', 'touchmove', 'touchend']) {
  overlay.addEventListener(type, e => {
    if (type !== 'mousemove') e.preventDefault();
    try { canvas.dispatchEvent(new e.constructor(type, e)); } catch (err) { console.warn('Could not pass ' + type + ' to the game', err); }
  });
}

// ---- Anki mining (js/apps/consanki.js) ----

// The recent lines with their voice files, and for the newest their screenshot and sound, so
// a card gets those of the line it was mined from (lineFor in consanki.js), however late it
// is noticed or from however far back in a backlog.
const KEPT_LINES = 500, KEPT_MEDIA = 30;
let keptLines = [], keepLines = false; // [{ text, voice, picture?: Promise<Blob>, audio?: Promise<Blob> }], oldest first

// The voice (dwave channel 0) of the page being read, and of the backlog page shown.
let lineVoice = null, backlogVoice = null, backlogText = '', spriteLines = '';
function consVoice(channel, file) { if (channel === 0) lineVoice = file; }

// Without a voice file, the game's sound from the click that brought the line: whatever
// the engine sends to the speakers is also sent to soundTap, a worklet on the audio thread
// that hands back 16-bit stereo blocks stamped with their first frame. The last minute of
// them is kept here, and a line's sound is cut from it, so nothing starts or stops per
// click (a new MediaRecorder at each click could make the game's sound pop).
const TAP_SECONDS = 60;
const TAP_WORKLET = `registerProcessor('cons-tap', class extends AudioWorkletProcessor {
  constructor() { super(); this.pcm = new Int16Array(8192); this.n = 0; }
  process([input]) {
    const l = input[0], r = input[1] || l, len = l ? l.length : 128;
    if (!this.n) this.start = currentFrame;
    for (let i = 0; i < len; i++, this.n += 2) {
      this.pcm[this.n] = l ? Math.max(-1, Math.min(1, l[i])) * 32767 : 0;
      this.pcm[this.n + 1] = l ? Math.max(-1, Math.min(1, r[i])) * 32767 : 0;
    }
    if (this.n === this.pcm.length) {
      this.port.postMessage({ start: this.start, pcm: this.pcm }, [this.pcm.buffer]);
      this.pcm = new Int16Array(8192); this.n = 0;
    }
    return true;
  }
});`;
let soundTap, tapReady = false, tapBlocks = [], tapEnd = 0, tapWaiting = [], recording = null, recordLines = false;
const nativeConnect = AudioNode.prototype.connect;
AudioNode.prototype.connect = function (target) {
  if (recordLines && target instanceof AudioDestinationNode) {
    if (!soundTap) startSoundTap(this.context);
    if (soundTap.context === this.context) nativeConnect.call(this, soundTap);
  }
  return nativeConnect.apply(this, arguments);
};

function startSoundTap(ctx) {
  soundTap = ctx.createGain(); // sources connect here at once; the worklet joins when loaded
  const url = URL.createObjectURL(new Blob([TAP_WORKLET], { type: 'text/javascript' }));
  ctx.audioWorklet.addModule(url).then(() => {
    const node = new AudioWorkletNode(ctx, 'cons-tap', { numberOfOutputs: 1, outputChannelCount: [1] });
    const mute = ctx.createGain();
    mute.gain.value = 0; // the worklet must reach the speakers to be run, silently
    nativeConnect.call(soundTap, node);
    nativeConnect.call(node, mute);
    nativeConnect.call(mute, ctx.destination);
    node.port.onmessage = ({ data }) => {
      tapBlocks.push(data);
      tapEnd = data.start + data.pcm.length / 2;
      while (tapBlocks.length && tapBlocks[0].start < tapEnd - TAP_SECONDS * ctx.sampleRate) tapBlocks.shift();
      tapWaiting = tapWaiting.filter(w => (tapEnd >= w.end ? (w.done(), false) : true));
    };
    tapReady = true;
    restartLineRecorder();
  }).catch(err => console.warn('No sound recording for Anki', err)).finally(() => URL.revokeObjectURL(url));
}

const tapNow = () => Math.round(soundTap.context.currentTime * soundTap.context.sampleRate);

// The kept sound from frame start to end, as a WAV, once the worklet has sent it (or after a
// second, if the sound has stopped: a suspended context sends nothing).
async function tapClip(start, end) {
  await new Promise(done => {
    if (tapEnd >= end) return done();
    tapWaiting.push({ end, done });
    setTimeout(done, 1000);
  });
  const frames = Math.max(0, end - start), pcm = new Int16Array(frames * 2);
  for (const b of tapBlocks) {
    const from = Math.max(start, b.start), to = Math.min(end, b.start + b.pcm.length / 2);
    if (from < to) pcm.set(b.pcm.subarray((from - b.start) * 2, (to - b.start) * 2), (from - start) * 2);
  }
  const head = new DataView(new ArrayBuffer(44)), rate = soundTap.context.sampleRate;
  [[0, 'RIFF'], [8, 'WAVE'], [12, 'fmt '], [36, 'data']].forEach(([o, s]) => [...s].forEach((c, i) => head.setUint8(o + i, c.charCodeAt(0))));
  head.setUint32(4, 36 + pcm.byteLength, true);
  head.setUint32(16, 16, true); head.setUint16(20, 1, true); head.setUint16(22, 2, true); // PCM, stereo
  head.setUint32(24, rate, true); head.setUint32(28, rate * 4, true);
  head.setUint16(32, 4, true); head.setUint16(34, 16, true);
  head.setUint32(40, pcm.byteLength, true);
  return new Blob([head, pcm], { type: 'audio/wav' });
}

// Keeps the last frame readable after it is shown, for screenshots.
const nativeGetContext = HTMLCanvasElement.prototype.getContext;
HTMLCanvasElement.prototype.getContext = function (type, attributes) {
  if (type === 'webgl' || type === 'webgl2') attributes = { ...attributes, preserveDrawingBuffer: true };
  return nativeGetContext.call(this, type, attributes);
};

// At each click wait while mining: the page so far, its voice, screen and (being recorded) sound.
function keepLine(lines) {
  if (!keepLines) return;
  const line = { text: lines.map(l => l.text).join(''), voice: lineVoice, picture: screenshot() };
  // The sound recorded since the click that brought this line is its sound.
  if (recording) recording.line = line;
  keptLines.push(line);
  if (keptLines.length > KEPT_LINES) keptLines.shift();
  const old = keptLines[keptLines.length - 1 - KEPT_MEDIA];
  if (old) old.picture = old.audio = undefined;
}

function stopLineRecorder() {
  if (!recording) return;
  if (recording.line) recording.line.audio = tapClip(recording.start, tapNow());
  recording = null;
}

function restartLineRecorder(e) {
  // Modifier keys are Yomitan's scan keys, not the game's.
  if (e && /^(Shift|Control|Alt|Meta)$/.test(e.key)) return;
  stopLineRecorder();
  if (tapReady) recording = { start: tapNow(), line: null };
}
for (const type of ['mousedown', 'touchstart', 'keydown']) addEventListener(type, restartLineRecorder, true);

const voiceTypes = { ogg: 'audio/ogg', wav: 'audio/wav', mp3: 'audio/mpeg' };
// A voice file named by the script, if it is a plain game file (not in an archive).
function voiceFile(name) {
  const file = name && gameFiles[name.replace(/\\/g, '/').toLowerCase()];
  const type = file && voiceTypes[name.split('.').pop().toLowerCase()];
  return type ? file.slice(0, file.size, type) : null;
}

// The kept lines' text, oldest first.
function ankiTexts() { return keptLines.map(l => l.text); }

// Backlog text on screen now: the built-in backlog's page, and script-drawn (strsp) text.
function shownPages() {
  const pages = [];
  if (inSystem && inBacklog) pages.push({ text: backlogText, voice: backlogVoice });
  if (!inSystem && spriteLines) pages.push({ text: spriteLines, voice: null });
  return pages;
}
function ankiShownTexts() { return shownPages().map(p => p.text); }

// Media for a mined line: kept line ankiTexts()[kept] and/or backlog page ankiShownTexts()[shown]
// (-1 for none). The picture is the screen when the line was shown, if still kept, else the
// screen as it is now (the backlog). The sound is the line's voice file, else the sound
// recorded from the click that brought it to the next, else the backlog page's voice file.
async function ankiMedia(kept, shown, want) {
  const line = keptLines[kept] || {}, page = shownPages()[shown] || {};
  if (recording && recording.line === line) stopLineRecorder(); // still recording: its sound ends now
  return {
    picture: want.picture ? (await line.picture) || (await screenshot()) : null,
    audio: want.audio ? voiceFile(line.voice) || (await oggOpus(await line.audio)) || voiceFile(page.voice) || null : null,
  };
}

// A recorded line's WAV as Ogg Opus, about a tenth of the size, for the card (WebCodecs;
// the WAV where it is missing or fails).
async function oggOpus(wav) {
  if (!wav || !window.AudioEncoder) return wav;
  try {
    const sound = await new OfflineAudioContext(2, 1, 48000).decodeAudioData(await wav.arrayBuffer()); // Opus runs at 48 kHz
    const packets = [];
    let failed = null;
    const enc = new AudioEncoder({ output: c => { const d = new Uint8Array(c.byteLength); c.copyTo(d); packets.push(d); }, error: e => { failed = e; } });
    enc.configure({ codec: 'opus', sampleRate: 48000, numberOfChannels: 2, bitrate: 96000 });
    const pcm = new Float32Array(sound.length * 2);
    pcm.set(sound.getChannelData(0));
    pcm.set(sound.getChannelData(1), sound.length);
    enc.encode(new AudioData({ format: 'f32-planar', sampleRate: 48000, numberOfFrames: sound.length, numberOfChannels: 2, timestamp: 0, data: pcm }));
    await enc.flush();
    enc.close();
    if (failed) throw failed;
    const PRESKIP = 312; // libopus's lookahead; the decoder drops it
    const head = new Uint8Array(19), hv = new DataView(head.buffer);
    head.set(new TextEncoder().encode('OpusHead'));
    head[8] = 1; head[9] = 2; hv.setUint16(10, PRESKIP, true); hv.setUint32(12, 48000, true);
    const tags = new Uint8Array(8 + 4 + 11 + 4);
    tags.set(new TextEncoder().encode('OpusTagsxxxxCONscripter'));
    new DataView(tags.buffer).setUint32(8, 11, true);
    const pages = [oggPage([head], 0, 2, 0), oggPage([tags], 0, 0, 1)];
    // Packets of 20 ms (960 frames) gathered into pages of up to 255 lacing values; the
    // last page's position cuts the encoder's padding off the end.
    for (let i = 0, done = 0; i < packets.length;) {
      const group = [];
      for (let lacing = 0; i < packets.length && lacing + Math.floor(packets[i].length / 255) + 1 <= 255; i++) {
        lacing += Math.floor(packets[i].length / 255) + 1;
        group.push(packets[i]);
      }
      done += group.length * 960;
      const last = i === packets.length;
      pages.push(oggPage(group, last ? PRESKIP + sound.length : PRESKIP + done, last ? 4 : 0, pages.length));
    }
    return new Blob(pages, { type: 'audio/ogg' });
  } catch (err) {
    console.warn('Keeping the WAV: no Opus', err);
    return wav;
  }
}

const OGG_CRC = new Uint32Array(256).map((_, i) => {
  let r = i << 24;
  for (let k = 0; k < 8; k++) r = r & 0x80000000 ? (r << 1) ^ 0x04c11db7 : r << 1;
  return r >>> 0;
});
function oggPage(packets, granule, flags, seq) {
  const lacing = [];
  for (const p of packets) { let n = p.length; for (; n >= 255; n -= 255) lacing.push(255); lacing.push(n); }
  const size = packets.reduce((sum, p) => sum + p.length, 0);
  const page = new Uint8Array(27 + lacing.length + size), v = new DataView(page.buffer);
  page.set([0x4f, 0x67, 0x67, 0x53]); // OggS
  v.setUint8(5, flags); // 2: first page, 4: last
  v.setBigUint64(6, BigInt(granule), true);
  v.setUint32(14, 0x636f6e73, true); // stream serial number
  v.setUint32(18, seq, true);
  v.setUint8(26, lacing.length);
  page.set(lacing, 27);
  let o = 27 + lacing.length;
  for (const p of packets) { page.set(p, o); o += p.length; }
  let crc = 0;
  for (const b of page) crc = ((crc << 8) ^ OGG_CRC[(crc >>> 24) ^ b]) >>> 0;
  v.setUint32(22, crc, true);
  return page;
}

function screenshot() { return new Promise(res => canvas.toBlob(res, 'image/webp', 0.9)); }

// ---- game files, read on demand ----

// Emscripten's own lazy files need a web worker, so these nodes read 1 MB slices of
// the File with a synchronous XHR on a blob: URL instead, and keep the most recent
// 64 MB of chunks around. The engine's fread() never notices.
// Firefox suspends the page's AudioContext for every synchronous XHR, and restarting
// the audio stream costs 32 ms or more of silence, so the chunk after each one read
// is fetched ahead asynchronously, and the engine (webPreload) asks for the bytes of
// each file before it reads them and waits while consPreload loads them.
const CHUNK = 1 << 20, CACHE_CHUNKS = (64 << 20) / CHUNK;
const cache = new Map(), pending = new Set(), failed = new Set();
let nextId = 0;

function prefetch(file, id, n) {
  const key = id + ':' + n, start = n * CHUNK;
  if (start >= file.size || cache.has(key) || pending.has(key) || failed.has(key)) return;
  pending.add(key);
  file.slice(start, Math.min(file.size, start + CHUNK)).arrayBuffer().then(b => {
    pending.delete(key);
    cache.set(key, new Uint8Array(b));
    if (cache.size > CACHE_CHUNKS) cache.delete(cache.keys().next().value);
  }, () => { pending.delete(key); failed.add(key); });
}

// True once the bytes from start are cached (or can't be: the read then stays synchronous).
function consPreload(fd, start, length) {
  const lazy = g_cons_module.FS.getStream(fd)?.node.lazy;
  if (!lazy) return true;
  const end = Math.min(lazy.file.size, start + length);
  if (end - start > CACHE_CHUNKS / 2 * CHUNK) return true; // would push its own chunks out
  let ready = true;
  for (let n = Math.floor(start / CHUNK); n * CHUNK < end; n++) {
    const key = lazy.id + ':' + n;
    if (cache.has(key) || failed.has(key)) continue;
    ready = false;
    prefetch(lazy.file, lazy.id, n);
  }
  return ready;
}

function readSlice(file, start, end) {
  const url = URL.createObjectURL(file.slice(start, end));
  try {
    const x = new XMLHttpRequest();
    x.open('GET', url, false);
    x.overrideMimeType('text/plain; charset=x-user-defined');
    x.send();
    const s = x.responseText, out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i) & 0xff;
    return out;
  } finally {
    URL.revokeObjectURL(url);
  }
}

function chunk(file, id, n) {
  const key = id + ':' + n;
  prefetch(file, id, n + 1);
  let c = cache.get(key);
  if (c) { cache.delete(key); cache.set(key, c); return c; }
  c = readSlice(file, n * CHUNK, Math.min(file.size, (n + 1) * CHUNK));
  cache.set(key, c);
  if (cache.size > CACHE_CHUNKS) cache.delete(cache.keys().next().value);
  return c;
}

const gameFiles = {}; // lower-case path under the game folder: File, for voices
function mountFile(FS, path, file) {
  gameFiles[path.slice(GAMEDIR.length + 1).toLowerCase()] = file;
  const i = path.lastIndexOf('/');
  const node = FS.createFile(path.slice(0, i), path.slice(i + 1), {}, true, false);
  const id = nextId++;
  node.lazy = { file, id };
  Object.defineProperty(node, 'usedBytes', { get: () => file.size });
  node.stream_ops = {
    ...node.stream_ops,
    read(stream, buffer, offset, length, position) {
      const end = Math.min(file.size, position + length);
      for (let p = position; p < end;) {
        const n = Math.floor(p / CHUNK), c = chunk(file, id, n), s = p - n * CHUNK;
        const take = Math.min(end - p, c.length - s);
        buffer.set(c.subarray(s, s + take), offset + (p - position));
        p += take;
      }
      return Math.max(0, end - position);
    },
  };
}

function mkdirs(FS, path) {
  let cur = '';
  for (const part of path.split('/').filter(Boolean)) {
    cur += '/' + part;
    try { FS.mkdir(cur); } catch {}
  }
}

// ---- saves ----

function listSaves(dir = savedir) {
  const FS = g_cons_module.FS, out = [];
  (function walk(dir, rel) {
    for (const name of FS.readdir(dir)) {
      if (name === '.' || name === '..') continue;
      const p = dir + '/' + name, st = FS.stat(p);
      if (FS.isDir(st.mode)) walk(p, rel + name + '/');
      else if (FS.isFile(st.mode)) out.push({ path: rel + name, data: FS.readFile(p), mtime: st.mtime });
    }
  })(dir, '');
  return out;
}

// files: [{ path, data, mtime }]; mtime (ms) keeps a synced file's own time, so the
// newer copy still wins next time. Without it, the file is new as of now.
async function writeSaves(files) {
  const FS = g_cons_module.FS;
  for (const f of files) {
    const p = savedir + '/' + f.path;
    mkdirs(FS, p.slice(0, p.lastIndexOf('/')));
    FS.writeFile(p, f.data);
    if (f.mtime) FS.utime(p, +f.mtime, +f.mtime);
  }
  await flush_save();
}

// ---- the parent window drives these ----

function key(type, keyCode, code, name) {
  canvas.dispatchEvent(new KeyboardEvent(type, { bubbles: true, cancelable: true, keyCode, which: keyCode, key: name, code }));
}
function press(keyCode, code) { key('keydown', keyCode, code, code); setTimeout(() => key('keyup', keyCode, code, code), 50); }
function pressEsc() { press(27, 'Escape'); }
function setSkip(on) { key(on ? 'keydown' : 'keyup', 17, 'ControlLeft', 'Control'); }

// ---- Debug menu ----

function showText(on) { document.body.classList.toggle('show-text', on); }
// --dump-vars writes here at F8.
const VARS_FILE = '/tmp/vars.txt';
async function dumpVars() {
  const FS = g_cons_module.FS;
  try { FS.unlink(VARS_FILE); } catch {}
  press(119, 'F8');
  for (let i = 0; i < 40; i++) {
    await new Promise(r => setTimeout(r, 50));
    try { return new TextDecoder().decode(FS.readFile(VARS_FILE)); } catch {}
  }
  return null;
}
// F8 also writes a dump record to the trace: the page's state (text, bg, sprites, music, ...) and the variables.
async function dumpState() {
  const got = new Promise(res => { traceWaiter = res; setTimeout(res, 2000, null); });
  press(119, 'F8');
  const line = await got;
  traceWaiter = null;
  return line && JSON.parse(line);
}
async function clearSaves() {
  const FS = g_cons_module.FS;
  for (const f of listSaves()) FS.unlink(savedir + '/' + f.path);
  await flush_save();
}

// Drops on the running game go to the window around it.
addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
addEventListener('drop', e => { e.preventDefault(); if (window.onGameDrop) window.onGameDrop(e.dataTransfer); });
addEventListener('pointerdown', () => canvas.focus());

// game: { files: [{ path, file }], title, font, encoding ('sjis' | 'utf8'), args (more engine options), onExit(code), onError(msg),
//   keepLines (keep the recent lines with their screenshots, for Anki), recordLines (and their sound), beforeRun() (once the saves are read, before the engine starts: Google Drive sync brings newer ones in) }
async function start(game) {
  const M = g_cons_module;
  M.onExit = code => game.onExit && game.onExit(code);
  M.onAbort = what => game.onError && game.onError(String(what));
  g_cons_index = { title: game.title };
  encoding = game.encoding === 'utf8' ? 'utf8' : 'sjis';
  keepLines = !!game.keepLines;
  recordLines = !!game.recordLines;
  await cons(M);
  const FS = M.FS;
  for (const f of game.files) {
    const p = GAMEDIR + '/' + f.path;
    mkdirs(FS, p.slice(0, p.lastIndexOf('/')));
    mountFile(FS, p, f.file);
  }
  savedir = '/cons_save/' + game.title;
  mkdirs(FS, savedir);
  FS.mount(M.IDBFS, {}, savedir);
  // Saves from before the engine rename sit in /onsyuri_save/<title>: move them over once.
  const oldSavedir = '/onsyuri_save/' + game.title;
  mkdirs(FS, oldSavedir);
  FS.mount(M.IDBFS, {}, oldSavedir);
  await new Promise(res => FS.syncfs(true, err => { if (err) console.warn(err); res(); }));
  const oldSaves = listSaves(oldSavedir);
  FS.unmount(oldSavedir);
  let oldDone = !oldSaves.length; // checking it made an empty one
  if (oldSaves.length && !listSaves().length) {
    for (const f of oldSaves) {
      const p = savedir + '/' + f.path;
      mkdirs(FS, p.slice(0, p.lastIndexOf('/')));
      FS.writeFile(p, f.data);
      FS.utime(p, +f.mtime, +f.mtime);
    }
    // The old database goes only once the copies are safely stored.
    const err = await new Promise(res => FS.syncfs(false, res));
    if (err) console.warn(err);
    oldDone = !err;
  } else if (oldSaves.length) console.warn('saves in both', oldSavedir, 'and', savedir, '; keeping', savedir);
  if (oldDone) {
    const db = M.IDBFS.dbs[oldSavedir]; // IDBFS keeps it open, which would hold up the delete
    if (db) { db.close(); delete M.IDBFS.dbs[oldSavedir]; }
    indexedDB.deleteDatabase(oldSavedir);
  }
  if (game.beforeRun) await game.beforeRun();
  canvas.focus();
  M.callMain(['--root', GAMEDIR, '--font', GAMEDIR + '/' + game.font, '--save-dir', savedir, '--enc:' + encoding,
    '--dump-vars', VARS_FILE, ...(game.args || [])]);
}
